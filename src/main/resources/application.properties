spring.application.name=chd-rental-api
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos PostgreSQL
#  - Local: jdbc:postgresql://localhost:5432/chd_rental (ver docker-compose.yml)
#  - Heroku: el buildpack de Java define JDBC_DATABASE_URL / USERNAME / PASSWORD
#  - Render u otros: se acepta DATABASE_URL=postgres://user:pass@host:port/db
# ---------------------------------------------------------------------------
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/chd_rental}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Seguridad (JWT). En la nube defina JWT_SECRET (Base64 de 48+ bytes).
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:eeIP59qLLdtdaUrI8qP5bEcE/YKzrNJ/ivjaL4Os2alNn8C6gBT7rR7dFnxmACH0}
app.jwt.expiracion-segundos=${JWT_EXPIRATION:3600}

# Datos iniciales (solo si las tablas estan vacias)
app.seed.enabled=${APP_SEED:true}
app.seed.admin-password=${ADMIN_PASSWORD:Admin123*}
app.seed.default-password=${SEED_PASSWORD:Chd12345*}

# Documentacion
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Monitoreo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
