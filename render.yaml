# Render: servicio web (Docker) + base de datos PostgreSQL
services:
  - type: web
    name: chd-rental-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chd-rental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: chd-rental-db
    plan: free
    databaseName: chd_rental
    user: chd_rental
